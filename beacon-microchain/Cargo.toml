[package]
name = "beacon-microchain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
# Align with the installed CLI/runtime (testnet_conway build, v0.15.11)
linera-sdk = { version = "0.15.11" }
linera-base = { version = "0.15.11" }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bincode = "1.3"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros"] }

[[bin]]
name = "beacon_microchain_contract"
path = "src/contract.rs"

[[bin]]
name = "beacon_microchain_service"
path = "src/service.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[target.wasm32-unknown-unknown.dependencies]
wasm-encoder = "0.245.1"
wasmparser = "0.245.1"
